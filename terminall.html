<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAMAHIT</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    height:100vh;
    overflow:hidden;
    font-family:monospace;
    color:#eaeaea;
}

/* ================= BACKGROUND SIMPLE DARK ================= */

.bg{
    position:absolute;
    inset:0;
    background:
    radial-gradient(circle at center,
    rgba(255,255,255,0.03),
    transparent 60%),
    #000;
}

/* sedikit noise */
.noise{
    position:absolute;
    inset:0;
    opacity:.04;
    background-image:url("https://i.imgur.com/8QfQk3v.png");
    mix-blend-mode:overlay;
}

/* ================= CENTER ================= */

.center{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

/* ================= LOGO CLEAN ================= */

.logo{
    width:160px;
    opacity:0;
    transform:scale(.95);
    animation:appear 2s forwards, microGlitch 4s infinite;
}

/* muncul pelan */
@keyframes appear{
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* glitch sangat halus TANPA CAHAYA */
@keyframes microGlitch{

    0%,100%{
        transform:translate(0,0);
    }

    20%{
        transform:translate(1px,0);
    }

    40%{
        transform:translate(-1px,0);
    }

    60%{
        transform:translate(0,1px);
    }

    80%{
        transform:translate(0,-1px);
    }
}

/* ================= TEXT ================= */

.text{
    margin-top:20px;
    font-size:13px;
    letter-spacing:6px;
    opacity:0;
    animation:fade 3s 1.5s forwards;
}

@keyframes fade{
    to{opacity:.6;}
}

/* ================= FLASH ================= */

.flash{
    position:fixed;
    inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
}

.flash.active{
    animation:flash .8s forwards;
}

@keyframes flash{
    0%{opacity:0;}
    50%{opacity:1;}
    100%{opacity:0;}
}

</style>
</head>
<body>

<div class="bg"></div>
<div class="noise"></div>

<div class="center">

    <img class="logo" src="https://i.ibb.co.com/Mkmn5twj/image.png">

    <div class="text">MAMAHIT SYSTEM</div>

</div>

<div class="flash" id="flash"></div>

<script>

const website =
"https://christheomamahit8-wq.github.io/mamahitterminal/Mamahit%20(1).html";

/* auto masuk */
setTimeout(()=>{

    document.getElementById("flash").classList.add("active");

    setTimeout(()=>{
        window.location.href = website;
    },800);

},4500);

</script>

</body>
</html>
